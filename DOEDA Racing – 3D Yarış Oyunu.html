
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE - Oyun Dünyası</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090b12;color:white;font-family:Arial,sans-serif}
header{height:75px;background:#111522;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #222a3b}
.logo{font-size:26px;font-weight:bold;color:#7c5cff}
nav{display:flex;gap:25px}
nav a{color:#ccc;text-decoration:none}
nav a:hover{color:#7c5cff}
.hero{text-align:center;padding:80px 20px;background:linear-gradient(135deg,#15152b,#0b1020)}
.hero h1{font-size:42px;margin-bottom:15px}
.hero h1 span{color:#7c5cff}
.hero p{color:#999;margin-bottom:30px}
.search{width:90%;max-width:500px;padding:15px 20px;background:#191e2e;border:1px solid #343b50;border-radius:10px;color:white;outline:none}
.container{width:86%;max-width:1300px;margin:45px auto}
.section-title{font-size:25px;margin-bottom:25px;border-left:4px solid #7c5cff;padding-left:12px}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.game-card{background:#151a29;border:1px solid #252d40;border-radius:13px;overflow:hidden;transition:.3s;cursor:pointer}
.game-card:hover{transform:translateY(-6px);border-color:#7c5cff;box-shadow:0 8px 25px #7c5cff22}
.game-image{height:160px;background:linear-gradient(135deg,#171b32,#30205b);display:flex;align-items:center;justify-content:center;color:#7c5cff;font-size:22px;font-weight:bold;letter-spacing:2px}
.game-info{padding:18px}
.game-info h3{font-size:17px;margin-bottom:8px}
.game-info p{color:#888;font-size:13px}
footer{margin-top:80px;padding:30px;text-align:center;background:#111522;color:#777;border-top:1px solid #252d40}
@media(max-width:900px){.games{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){
header{padding:0 5%}
nav{gap:12px;font-size:12px}
.logo{font-size:20px}
.hero h1{font-size:30px}
.games{grid-template-columns:1fr}
.container{width:90%}
}
</style>
</head>

<body>

<header>
<div class="logo">GAMEZONE</div>
<nav>
<a href="#">Ana Sayfa</a>
<a href="#games">Oyunlar</a>
<a href="#about">Hakkımızda</a>
</nav>
</header>

<section class="hero">
<h1>OYUN <span>DÜNYASINA</span> HOŞ GELDİN</h1>
<p>En sevdiğin oyunları keşfetmeye hazır mısın?</p>
<input type="text" class="search" id="search" placeholder="Oyun ara...">
</section>

<main class="container" id="games">
<h2 class="section-title">Oyunlar</h2>

<div class="games" id="gameList">

<div class="game-card" onclick="location.href='games/doeda-racing.html'">
<div class="game-image">DOEDA RACING</div>
<div class="game-info">
<h3>DOEDA Racing</h3>
<p>3D Araba Yarışı</p>
</div>
</div>

<!-- YENİ OYUNLARINI BURAYA EKLEYEBİLİRSİN -->

</div>
</main>

<footer id="about">
© 2026 GAMEZONE - Tüm Hakları Saklıdır.
</footer>

<script>
document.getElementById("search").addEventListener("input",function(){
const q=this.value.toLowerCase();
document.querySelectorAll(".game-card").forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(q)?"block":"none";
});
});
</script>

</body>
</html>
